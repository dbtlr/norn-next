norn-fs = { path = "../norn-fs" }
norn-store = { path = "../norn-store" }
norn-text = { path = "../norn-text" }
norn-wire = { path = "../norn-wire" }

[dev-dependencies]
norn-testkit = { path = "../norn-testkit" }
