[package]
name = "norn-host"
description = "The protocol-blind orchestrator — registry semantics, lazy vault attachment, and bounded lifecycle scheduling"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# `induced-failure` is this crate's harness-reachable surface, and it carries
# two things. It forwards to the feature of the same name in both effect crates:
# `norn-store`'s, which is the fenced seam a suite reaches a rung or a refusal
# through from outside, and `norn-fs`'s, whose watcher half is what makes a
# refused registration, a stream that fails and a stream that reports its path
# set lost reachable by a host attached over a real backend. And it gates the
# readers of what a host's own jobs did — `JobEvidence`, `EvidenceReading`,
# `ProductionEntryOps::account`, `Host::classifications` and
# `Host::recovery_demands`. Those accounts are *written* on every build, because
# that is how a job's cost stops being discarded; nothing in the shipped
# artifact reads them back, so a build without this feature carries no reader.
[features]
induced-failure = ["norn-fs/induced-failure", "norn-store/induced-failure"]

[dependencies]
norn-config = { path = "../norn-config" }
norn-embed = { path = "../norn-embed" }
norn-fs = { path = "../norn-fs" }
norn-semantic = { path = "../norn-semantic" }
norn-store = { path = "../norn-store" }
norn-text = { path = "../norn-text" }
norn-wire = { path = "../norn-wire" }
serde_yaml = { workspace = true }

# The measurement suites attach a real host over a generated vault tree, so the
# generator is a development edge of this crate. It is a dev edge and cycles
# back — the testkit names the generator's profiles as the scales of a
# size-independence pair — which is why the allowlist does not describe it: dev
# edges cycle by construction and the architecture gate reads and discards them.
[dev-dependencies]
norn-fixtures = { path = "../norn-fixtures" }
norn-store = { path = "../norn-store", features = ["induced-failure"] }
norn-testkit = { path = "../norn-testkit" }
