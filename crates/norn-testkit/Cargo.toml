[package]
name = "norn-testkit"
description = "Assertion helpers and harness scaffolding for the norn workspace; never ships"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# `norn-fixtures` is the generator whose profiles name the two scales a
# size-independence pair is run at. `libc` is the child-process accounting the
# process harness reads its peak resident set from.
#
# The dependency allowlist (docs/architecture.md) carries `norn-testkit ->
# norn-wire` and `norn-testkit -> norn-store`, and the architecture gate
# requires every permitted edge whose two endpoints are both present, so both
# edges are declared here. Nothing in this crate imports either yet: the
# `EXPLAIN` and counter assertions read through `norn-store`'s own API, so the
# edge is what makes that reachable and this crate still opens no connection
# itself.
[dependencies]
libc = { workspace = true }
norn-fixtures = { path = "../norn-fixtures" }
norn-store = { path = "../norn-store" }
norn-wire = { path = "../norn-wire" }
serde = { workspace = true }
serde_json = { workspace = true }
# The architecture gate reads the workspace root manifest: `[patch.crates-io]`
# is what makes a directory under `vendor/` a patched published release rather
# than a local crate hiding in an exempt directory.
toml = { workspace = true }
