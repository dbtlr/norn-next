[package]
name = "norn-wire"
description = "The vocabulary — what a request names, trust states and the structured error envelope as pure wire types"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# A leaf in the dependency allowlist (docs/architecture.md): zero workspace
# dependencies, so nothing about vaults, stores, filesystems, protocols or
# configuration can reach this crate. The registry dependencies are the
# wire itself rather than implementation behind a seam — `serde` is the
# serialization every type here carries, and `schemars` is the schema every
# surface derives its rendering from.
#
# `serde_json` is here for one thing: the cursor's opaque rendering, which is
# base64 of the canonical JSON of the cursor's own fields. It appears in no
# signature — nothing crossing this seam is an untyped JSON value — and its one
# runtime use is inside that wrapping. It is a registry dependency and not a
# workspace one, so the zero-workspace-dependency invariant stands.
#
# `float_roundtrip` parses a number back to the double that was written. A hit
# cursor carries a relevance score a continuation compares exactly, and the
# cursor is read back only where its re-encoding is the bytes it arrived as, so
# a score parsed one unit in the last place away is a cursor refused.
[dependencies]
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
