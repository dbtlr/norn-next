[package]
name = "norn-config"
description = "Machine-local state, one owner — the config-directory layout, the registry file, the bearer tokens, the loopback endpoint conventions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Two workspace dependencies in the allowlist (docs/architecture.md): the
# vocabulary and the document syntax, both leaves. Nothing about vaults,
# stores, protocols or orchestration can reach this crate, and nothing here can
# reach them — the registry file's *shape* lives here and the registry's
# *semantics* live in `norn-host`, which an edge in this direction would blur.
#
# `norn-wire` owns the grammars a registration is spelled in — the vault name,
# the root, the schema source, and the watch backend — because each of them
# crosses the client/host seam as well as being written into the registry file.
# The edge points at the leaf everything else already points at: the vocabulary
# reaches nothing, so this crate reaching it adds nothing beneath it.
#
# `norn-text` is the one reader of link syntax (invariant 10): the `link` field
# type reads a string as a wikilink through it, and compares two links by the
# key it renders from the parsed link, so the schema never carries a second
# grammar for `[[…]]`. The edge is to a leaf — `norn-text` reaches no workspace
# crate — and `norn-config` still reaches nothing about vaults, stores,
# protocols or orchestration. It does widen who reaches the document syntax:
# `norn-client` and `norn-serve` reach `norn-text` through this crate. No
# invariant forbids that, and the shipped binary already links `norn-text`
# through the host.
#
# `toml` is the format every machine-local file is written in, and this crate
# is the only reader and writer of them. The registry's tolerant reader is
# built on the untyped `toml::Table` rather than on a derived deserializer:
# preserving a field this binary does not know about requires holding the
# document as it was read, which a struct with named fields cannot do. The
# feature set is the default one spelled out — `parse` and `display` are the
# two halves of the round trip, and `serde` is what `toml`'s own serializer is
# written against.
#
# `libc` is here for one thing: `O_NOFOLLOW`, which the standard library has
# no name for. The lock file is opened with it so that a symlink planted at
# the lock name is refused rather than followed, and spelling the flag's value
# per platform by hand is a portability bug waiting for its target.
#
# `unicode-normalization` is what `|slug` reads text through: canonical
# composition first, so an accent written as its own mark slugs as the accented
# letter does, and the combining-mark property, so a mark stays in the word it
# is written in rather than splitting it.
[dependencies]
libc = { workspace = true }
norn-text = { path = "../norn-text" }
norn-wire = { path = "../norn-wire" }
serde_yaml = { workspace = true }
toml = { workspace = true }
unicode-normalization = { workspace = true }

# The channel a build is pinned to. Absent is the dev channel, which is what a
# development build and every test run is; a release build of the shipped
# artifact turns this on. It gates no code path — it selects the app-directory
# name and the default port, and through them every machine-local path — so
# that a dev binary cannot reach live state by any route, mistake included.
[features]
channel-live = []

# Every scratch tree this crate's suites work in is named and removed through
# `norn_testkit::scratch`, so one helper owns what a temporary directory is
# called and when it goes away. The edge is a development one, and the
# allowlist does not describe it: dev edges cycle by construction and the
# architecture gate reads and discards them.
[dev-dependencies]
norn-testkit = { path = "../norn-testkit" }
