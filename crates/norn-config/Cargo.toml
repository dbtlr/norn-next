[package]
name = "norn-config"
description = "Machine-local state, one owner — the config-directory layout, the registry file, the bearer tokens, the loopback endpoint conventions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# One workspace dependency in the allowlist (docs/architecture.md), and it is
# the vocabulary. Nothing about vaults, stores, protocols or orchestration can
# reach this crate, and nothing here can reach them — the registry file's
# *shape* lives here and the registry's *semantics* live in `norn-host`, which
# an edge in this direction would blur.
#
# `norn-wire` owns the vault-name grammar, because a name crosses the
# client/host seam as well as keying the registry table and naming a directory.
# The edge points at the leaf everything else already points at: the vocabulary
# reaches nothing, so this crate reaching it adds no reachability at all.
#
# `toml` is the format every machine-local file is written in, and this crate
# is the only reader and writer of them. The registry's tolerant reader is
# built on the untyped `toml::Table` rather than on a derived deserializer:
# preserving a field this binary does not know about requires holding the
# document as it was read, which a struct with named fields cannot do. The
# feature set is the default one spelled out — `parse` and `display` are the
# two halves of the round trip, and `serde` is what `toml`'s own serializer is
# written against.
#
# `libc` is here for one thing: `O_NOFOLLOW`, which the standard library has
# no name for. The lock file is opened with it so that a symlink planted at
# the lock name is refused rather than followed, and spelling the flag's value
# per platform by hand is a portability bug waiting for its target.
[dependencies]
libc = { workspace = true }
norn-wire = { path = "../norn-wire" }
toml = { workspace = true }

# The channel a build is pinned to. Absent is the dev channel, which is what a
# development build and every test run is; a release build of the shipped
# artifact turns this on. It gates no code path — it selects the app-directory
# name and the default port, and through them every machine-local path — so
# that a dev binary cannot reach live state by any route, mistake included.
[features]
channel-live = []

# Every scratch tree this crate's suites work in is named and removed through
# `norn_testkit::scratch`, so one helper owns what a temporary directory is
# called and when it goes away. The edge is a development one, and the
# allowlist does not describe it: dev edges cycle by construction and the
# architecture gate reads and discards them.
[dev-dependencies]
norn-testkit = { path = "../norn-testkit" }
