[package]
name = "norn-store"
description = "An SDK for talking to SQL — the store schema, the DDL fingerprint, the three pillars and the database-side heal rung"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The dependency allowlist (docs/architecture.md) carries `norn-store ->
# norn-wire` and `norn-store -> norn-db`, and nothing else out of this crate:
# parsing happens in host orchestration, so this crate's API takes typed facts
# and never a document. `norn-wire` is the vocabulary a findings row records
# the kind and severity it was handed from.
#
# `norn-db` is the substrate this crate is the first client of. It owns the
# connection, the pinned-scalar mechanics, the DDL fingerprint, the store epoch
# and the database file's lifecycle; this crate owns what the statements and
# the rows mean. The driver is declared by that crate's manifest alone — the
# workspace root pins its version and its features — and reached through its
# re-export, which is what makes "one crate knows SQL" a fact about the
# manifests and not only about the code.
#
# `sha2` is here because this crate hashes rather than only stores hashes. A
# document row carries a sub-fingerprint per part a change-feed consumer derives
# from — the body, and the frontmatter projection — and each is stamped at the
# one derivation site, over the value the increment is already writing. That is
# what lets a consumer triage before it fetches, and stamping it anywhere else
# would put a second answer to "what is at rest here" outside the write that
# put it there.
[dependencies]
norn-db = { path = "../norn-db" }
norn-wire = { path = "../norn-wire" }
sha2 = { workspace = true }

# `induced-failure` gates `induced_failure`, the module of out-of-band
# arrangements the store's own suite reaches through to reach a rung or a
# refusal from outside — a store schema this build did not write, a dropped
# index, a busy database, a process killed mid-changeset. It forwards to
# `norn-db`'s feature of the same name, because two of the arrangements are met
# at the driver seam rather than here. Off by default, so a shipped build
# carries none of the hooks: the out-of-band SQL executor, the busy-injection
# thread-local read on every pinned scalar, and the tear the increment checks
# between two entries.
[features]
induced-failure = ["norn-db/induced-failure"]

# This crate is its own dev-dependency, with the feature turned on, because
# the integration suite in `tests/` links against `norn-store` as an external
# crate and needs the fenced seam the feature gates — the same reason a
# feature-gated test module cannot simply live behind `#[cfg(test)]`.
[dev-dependencies]
norn-store = { path = ".", features = ["induced-failure"] }
norn-testkit = { path = "../norn-testkit" }
