[package]
name = "norn-serve"
description = "The HTTP surface and the host process it runs in — the channel lock, the bearer token and the hello, the serving socket and the server log"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# `GET /v1/debug/counters`: the server's cumulative `serve.*` counters behind
# the bearer, for the counter bars a test or nightly build of the binary reads.
# Off by default, so no shipped build serves it.
#
# It also turns on `norn-host`'s `evidence` feature, so the route answers the
# host's per-request tallies and job account beside its own counters, and every
# wire answer carries `x-norn-host-time-us`.
counters = ["norn-host/evidence"]
# The write seam's faults in the host this server runs, read from the
# environment of a test's own `norn serve`: `norn`'s drain cases arm a hold on
# an apply's write through it. Off by default, so no shipped build reads it.
induced-failure = ["norn-host/induced-failure"]

[dependencies]
# The HTTP/1.1 server the routes are served by (ruling R2: hyper 1 on tokio,
# and no async type reaches norn-host), and the low-level
# HTTP/1.1 client the takeover dial speaks its hello over.
hyper = { version = "1.11", features = ["client", "http1", "server"] }
# The bridge from tokio's sockets to hyper's I/O traits.
hyper-util = { version = "0.1.21", features = ["tokio"] }
# The bodies a route answers with, and the capped read of a request's body.
http-body-util = "0.1.5"
# One current-thread runtime for the listener and its connections, the timers
# that pace a failing accept, bound each connection and body, pace the
# readiness retry and the held-lock wait, and end the drain, and the blocking
# thread the host is constructed on. Host calls run on this crate's own fixed
# pools, never on tokio's blocking pool. Signals are not tokio's: a thread of
# this crate's own takes them by `sigwait` (`libc` below).
# `sync` holds the per-vault mutation semaphores, the one-shot channel a pool
# thread hands a host call's answer back on, and the drain's and the stop
# trigger's wake-ups.
tokio = { version = "1.52", features = ["macros", "net", "rt", "sync", "time"] }
# The four calls the process lifecycle needs and the standard library does not
# name, in `sys.rs` alone: the thread signal mask set before any thread is
# spawned, `sigwait` on the signal thread, reading SIGHUP's inherited
# disposition so `nohup` keeps ignoring it, and `_exit`, which a hard deadline
# fires without writing anything or running a destructor.
libc = { workspace = true }
# The operating system's random source: the 32 bytes of the token minted at a
# first start, and the takeover dial's hello nonce. This crate is the one mint
# site; nothing else in the workspace draws a credential.
getrandom = "0.4"
# HMAC-SHA256: the hello's MAC, keyed by the labelled token, which the host
# answers with and the takeover dial verifies. Built on the workspace's `sha2`.
hmac = "0.13"
# SHA-256 over a presented bearer, the key it is looked up by: one lookup,
# never a walk over the stored tokens.
sha2 = { workspace = true }
# The constant-time comparison of a presented bearer with the stored secret
# its digest found, so the time a refusal takes says nothing about the secret.
subtle = "2.6"
# The hello's and the refusals' JSON bodies, the counters route's object, and
# each wire verb's params and report.
serde_json = { workspace = true }
# The one-field readers a mutation's vault is read off its body with, before
# the body is parsed whole on the mutation pool.
serde = { workspace = true }
norn-config = { path = "../norn-config" }
norn-host = { path = "../norn-host" }
# Pure tool-list preparation before listening; the server retains encoded bytes.
norn-mcp = { path = "../norn-mcp" }
norn-wire = { path = "../norn-wire" }

[dev-dependencies]
# `norn-config`'s `test-support` names `WatchedTokens::read_with_clock`, the
# clock seam this crate's in-process credential tests stand a settled token
# file on. A whole-workspace run turns it on through `norn-config`'s own
# dev-dependency, and this package's shard must build its tests with the same
# set (`norn-testkit --test shards`).
norn-config = { path = "../norn-config", features = ["test-support"] }
# A whole-workspace run builds `norn-fs`, `norn-store` and, through
# `norn-store`, `norn-db` with their fault features on: `norn-host`'s
# dev-dependencies name them, and each of the two crates names itself. This
# package's shard runs without `norn-host`'s tests selected, so these two
# entries keep that same set for it (`norn-testkit --test shards`). Nothing in
# this crate's suites arms a fault.
norn-fs = { path = "../norn-fs", features = ["test-support", "induced-failure"] }
norn-store = { path = "../norn-store", features = ["induced-failure"] }
# The scratch directories the mint's and the credential state's unit suites
# keep a token file in. A development edge: the allowlist does not describe
# it, and the architecture gate reads and discards it.
norn-testkit = { path = "../norn-testkit" }
# `norn-mcp`'s schema validator. A whole-workspace run builds it through that
# crate's dev-dependency, which switches features on in `hashbrown`,
# `regex-automata` and `syn`; this package's shard links those crates and must
# build them with the same set (`norn-testkit --test shards`). It never ships.
jsonschema = { version = "0.46", default-features = false }
