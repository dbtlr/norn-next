[package]
name = "norn-fs"
description = "The vault filesystem seam — normalized reads, guarded writes, locking, and change detection"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# A leaf in the dependency allowlist (docs/architecture.md): zero workspace
# dependencies. Vault bytes are reached through this crate and nothing about
# stores, schemas, plans or orchestration reaches into it — a write takes a
# path, bytes and a hash, and hands back an identity.
#
# `sha2` is the content hash. Only a content hash concludes "unchanged"
# anywhere in the system, so the algorithm behind that conclusion is a
# workspace dependency rather than a per-crate choice.
#
# `libc` is here for the flags and error numbers the standard library has no
# name for: `O_NOFOLLOW`, so a symlink planted at a path this crate opens is
# refused rather than followed, and `ENOSPC`/`EXDEV`, so a caller can tell a
# full disk from a shadow directory on the wrong filesystem. Spelling either by
# hand per platform is a portability bug waiting for its target.
#
# `notify` is the platform watcher backend. Its event vocabulary never crosses
# this crate boundary; callers receive only typed dirty sets and rescan scopes.
# `induced-failure` makes this crate's fault seams reachable from outside it:
# the write protocol's entry points (`stage`, `publish`, `confirm_landed`,
# `discard`) and the public watch entry points arm themselves from the environment
# instead of passing no faults at all. It exists because the process-death bars
# over the publication protocol cannot be stated by a caller that returns — a
# child dies inside staging or publication and its parent reads what was left
# at rest — because a full disk has no `io::ErrorKind` a test can otherwise ask for, and
# because refused coverage, a failed stream, and a boundary that never arrives
# are stated about a process the platform does not cooperate with. It also
# gives a subscription a look at its delivery slot that leaves the batch there,
# for a suite ordering a change against what a heal window takes. Off by
# default, so a shipped build reads no arm variable and carries no arm.
[features]
induced-failure = []

[dependencies]
libc = { workspace = true }
notify = { workspace = true }
# Descriptor-relative traversal keeps containment true across name-replacement races.
rustix = { workspace = true }
sha2 = { workspace = true }

# This crate is its own dev-dependency, with the feature turned on, because the
# lockdown suite in `tests/` links against `norn-fs` as an external crate and
# arms the widened seam through the environment the public entry point reads.
[dev-dependencies]
norn-fixtures = { path = "../norn-fixtures" }
norn-fs = { path = ".", features = ["induced-failure"] }
norn-testkit = { path = "../norn-testkit" }
