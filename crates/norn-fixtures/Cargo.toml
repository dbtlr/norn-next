[package]
name = "norn-fixtures"
description = "Deterministic Markdown vault generator for tests, gates, and the soak lane; never ships"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "norn-fixtures"
path = "src/main.rs"

# This crate has no dependencies, and that is a contract rather than an
# accident: it is a leaf in the dependency allowlist (docs/architecture.md),
# and a generator that links a parser, a hasher, or a random-number crate
# inherits that crate's version drift into the trees every gate measures
# against. The digest, the calendar arithmetic, the PRNG and the argument
# parsing are all in-crate for that reason.
[dependencies]

# The measurement suite spawns this crate's own binary under the testkit's
# process harness and reads the peak resident set the kernel accounted to it.
# The edge is a development one and cycles back — the testkit names this
# crate's profiles as the two scales of a size-independence pair — which is
# why the allowlist does not describe it: dev edges cycle by construction and
# the architecture gate reads and discards them.
[dev-dependencies]
norn-testkit = { path = "../norn-testkit" }
