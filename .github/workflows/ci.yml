# Per-PR gate lane.
#
# CI is two-tier: counters gate here, clocks trend in soak.yml. No wall-clock
# pass/fail ever runs in this lane — see docs/architecture.md.
#
# The timeout-minutes below are not an exception to that. A timeout is a
# runaway guard: it bounds what a hung job can cost, and it is set loose
# enough that a job approaching it is broken rather than slow. Performance
# clocks — the bars that fail when a number drifts — live in soak.yml.
#
# A job whose name carries a "(placeholder — ...)" suffix is structure only:
# it passes trivially so the lane exists, triggers, and is reviewable before
# it has teeth, and it is filled by the harness task named in its comment.
# The suffix drops when the real gate lands, so a green check on a job
# without one is a gate that actually ran.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR pushes are cancellable; gate runs on main are not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A real gate, not a placeholder: the workspace compiles and its tests pass.
  # The corpus suite is dormant — no command is activated — so this job builds
  # and runs in seconds; what it asserts is that the workspace holds together
  # and that the corpus data is structurally sound.
  build:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The toolchain comes from rust-toolchain.toml, which rustup honors.
      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace

  # Filled by NORN-12 (drift-prevention harness): the architecture gate reads
  # `cargo metadata` and asserts the workspace normal-dependency graph exactly
  # equals the allowlist in docs/architecture.md, under a pinned feature/target
  # matrix. Symbol-level rules escalate to lint tooling in the same task.
  architecture:
    name: architecture gate (placeholder — NORN-12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pending
        run: |
          echo "Architecture gate lands with NORN-12."
          echo "Asserts: workspace dependency allowlist, boundary lints."

  # Filled by NORN-12 (counter and EXPLAIN assertions) and NORN-13
  # (size-independence pairs). All assertions are counts, never clocks, at a
  # ~2k-document realistic fixture profile.
  gates:
    name: counter and plan gates (placeholder — NORN-12/13)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Pending
        run: |
          echo "Counter and plan gates land with NORN-12 and NORN-13."
          echo "Asserts: zero derivation counters on warm paths;"
          echo "         EXPLAIN plans against the builder's emitted SQL;"
          echo "         size-independence pairs, expressed as counts."

  # Filled by NORN-13 (instrumentation harness): peak memory at the
  # ~2k-document profile. The trend line over time lives in the soak lane;
  # this job is the per-PR bar.
  memory:
    name: memory invariant (placeholder — NORN-13)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Pending
        run: |
          echo "Memory invariant gate lands with NORN-13."
          echo "Asserts: peak memory is a function of the working set,"
          echo "         not of vault size."
