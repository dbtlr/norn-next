# Per-PR gate lane.
#
# CI is two-tier: structure and counters gate here, clocks trend in soak.yml.
# No wall-clock pass/fail ever runs in this lane — see docs/architecture.md.
# "Counters" names the measurement gates this lane is being built toward; a
# gate that asserts structure rather than a number belongs here too, on the
# same terms.
#
# The timeout-minutes below are not an exception to that. A timeout is a
# runaway guard: it bounds what a hung job can cost, and it is set loose
# enough that a job approaching it is broken rather than slow. Performance
# clocks — the bars that fail when a number drifts — live in soak.yml.
#
# A job whose name carries a "(placeholder — ...)" suffix is structure only:
# it passes trivially so the lane exists, triggers, and is reviewable before
# it has teeth, and it is filled by the harness task named in its comment.
# The suffix drops when the real gate lands, so a green check on a job
# without one is a gate that actually ran.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR pushes are cancellable; gate runs on main are not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A real gate, not a placeholder: the workspace compiles clean, is
  # formatted, and its tests pass. The corpus suite is dormant — no command is
  # activated — so this job runs in seconds; what it asserts is that the
  # workspace holds together and that the corpus data is structurally sound.
  build:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The toolchain comes from rust-toolchain.toml, which rustup honors.
      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Build
        run: cargo build --locked --workspace
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace

  # The architecture gate: it reads `cargo metadata` once per entry in the
  # pinned feature matrix and asserts the workspace normal-dependency graph
  # against the allowlist in docs/architecture.md; it asserts the transcribed
  # allowlist and crate list against the tables in that document; it refuses a
  # local crate the workspace does not hold as a member; and it holds the
  # invariant-to-mechanism mapping to the boundary lints configured in
  # clippy.toml. The lints themselves bind in the build job, where clippy runs.
  architecture:
    name: architecture gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Gate
        run: cargo test --locked -p norn-testkit --test architecture

  # Still a placeholder, and waiting on subjects rather than on machinery. The
  # machinery — counter snapshots, the SQL-and-plan pairing, the
  # size-independence pair — is in norn-testkit already.
  #
  # The derivation counters and the read builders that emit the SQL arrive
  # with norn-store, at Layer 1: that is what brings the zero-counter bar on
  # warm paths and the size-independence pairs expressed as counts. The
  # EXPLAIN bars arrive with the Layer 3 read builders, because a plan
  # assertion is only worth anything against the statement a builder emitted.
  # All of it is counts, never clocks, at the ~2k-document realistic profile.
  gates:
    name: counter and plan gates (placeholder — Layers 1 and 3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Pending
        run: |
          echo "Counter and plan gates land with their subjects."
          echo "Layer 1 (norn-store): zero derivation counters on warm paths;"
          echo "                      size-independence pairs, as counts."
          echo "Layer 3 (read builders): EXPLAIN plans against emitted SQL."

  # A real gate. It spawns the fixture generator under the testkit's process
  # harness and holds the peak resident set the kernel accounted to that child
  # to a checked-in ceiling, at the ~2k-document realistic profile. The bar is
  # authored and moves only by a reviewed edit; the readings behind it are in
  # crates/norn-fixtures/tests/baselines/mod.rs.
  #
  # The generator is the subject because it is the one that exists. norn-store
  # slots in at Layer 1, and its request paths become what this job measures;
  # the ~5k scale and the peak-memory trend line stay in soak.yml, where a
  # clock is legal to read.
  memory:
    name: memory invariant
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Memory bar
        run: cargo test --locked -p norn-fixtures --test memory
