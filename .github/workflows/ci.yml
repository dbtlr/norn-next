# Per-PR gate lane.
#
# CI is two-tier: structure and counters gate here, clocks trend in certify.yml.
# No wall-clock pass/fail ever runs in this lane — see docs/architecture.md.
# "Counters" names the measurement gates this lane is being built toward; a
# gate that asserts structure rather than a number belongs here too, on the
# same terms.
#
# The timeout-minutes below are not an exception to that. A timeout is a
# runaway guard: it bounds what a hung job can cost, and it is set loose
# enough that a job approaching it is broken rather than slow. The deadlines
# the suites here carry in-test — how long a child process may run, how long
# an attachment may take to converge — are the same species, set the same way
# and reported the same way: a run that reaches one is stuck rather than slow,
# and it fails naming what it last saw instead of naming a duration.
# Performance clocks — the bars that fail when a number drifts — live in
# certify.yml.
#
# **Every suite here runs through the flake tripwire.** This is the lane a
# failure gets rerun on, and a rerun of a failure this workspace has already
# ruled on leaves nothing behind. `.github/scripts/flake-tripwire.sh` runs the
# suite, matches a failing run's output against the entries in
# `.github/flake-ledger`, and writes each match into the run as an annotation
# and a job-summary block naming the ruling. It changes no verdict and retries
# nothing: the suite's own exit status is the step's.
#
# A step that reaches its suite through another script is wrapped on the
# outside of it. `lane-suite.sh` runs `cargo test -- --ignored` and fails a step
# that ran no case, so it is a suite step like any other and its output — the
# suite's, and the script's own error — is what the tripwire scans.
#
# The scheduled tier does not wrap its steps the same way. Every one of its
# suite logs is kept and its record is a typed artifact, so a recurrence there
# is already written down; what the wrapper removes is the quiet rerun, which
# is this lane's hazard.
#
# A job whose name carries a "(placeholder — ...)" suffix is structure only:
# it passes trivially so the lane exists, triggers, and is reviewable before
# it has teeth, and it is filled by whatever its comment names — a task where
# one exists, and otherwise the layer that brings the missing subject.
# The suffix drops when the real gate lands, so a green check on a job
# without one is a gate that actually ran.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR pushes are cancellable; gate runs on main are not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A real gate, not a placeholder: the workspace compiles clean, is
  # formatted, and its tests pass. The corpus suite is dormant — no command is
  # activated — so this job runs in seconds; what it asserts is that the
  # workspace holds together and that the corpus data is structurally sound.
  build:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The toolchain comes from rust-toolchain.toml, which rustup honors.
      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Build
        run: cargo build --locked --workspace
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # The lint above never sees norn-db's, norn-fs's or norn-store's library
      # with the feature off. norn-fs and norn-store are each their own
      # dev-dependency with `induced-failure` on, and norn-store forwards the
      # feature to norn-db, so `--all-targets` pulls the dev graph in and cargo
      # unifies the feature to on for every target in the run — including the
      # libraries. The shipped build is the feature-off one, and the items each
      # fault seam leaves behind there are held clean by `cfg_attr` allows that
      # nothing else checks. This step is the lane that checks them: the
      # libraries alone, no dev targets, no feature.
      - name: Lint the shipped libraries
        run: cargo clippy --locked -p norn-db -p norn-fs -p norn-store --lib -- -D warnings
      # The workspace lint above builds norn-host's targets with its
      # `induced-failure` feature off, and that crate's lockdown, soak-load and
      # crash-convergence suites are whole files behind the feature: with it off
      # they compile to nothing, so no lint ever reads them. This step is the
      # lane that does — the same reason the test job below names the feature
      # for that crate.
      - name: Lint the induced-failure targets
        run: cargo clippy --locked -p norn-host --all-targets --features induced-failure -- -D warnings
      # rustdoc is its own compiler pass: a public doc that links a private
      # item, or an intra-doc link that resolves to nothing, is a warning only
      # this pass sees, and no lint above reads it. Denied here so the doc
      # lane cannot drift red on main between reviews.
      - name: Document
        run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Test
        run: .github/scripts/flake-tripwire.sh cargo test --locked --workspace
      # Four crates declare an `induced-failure` feature, and the workspace test
      # above reaches three of them. norn-fs and norn-store each turn their own
      # on through a self dev-dependency, and norn-store forwards it to norn-db,
      # so those crates' lockdown and environment suites run above already.
      # norn-host's is a feature a caller asks for, and
      # nothing above asks: its crash-convergence proof (kill_recovery.rs), its
      # lockdown suite and its soak load (host_soak.rs, whose case the scheduled
      # lane runs) are whole files behind it and compile to zero tests there.
      # This step is scoped to that crate for that reason.
      - name: Induced-failure recovery
        run: .github/scripts/flake-tripwire.sh cargo test --locked -p norn-host --features induced-failure

  # A targeted second-architecture gate. The default build already runs the
  # full workspace on Linux x86_64; this job holds the contracts whose
  # answers can otherwise drift with architecture or filesystem behavior
  # without paying to duplicate that entire suite: embedding determinism,
  # norn-fs's filesystem contracts, and norn-host's case-insensitive-rename
  # convergence, which only exercises on a case-insensitive filesystem —
  # APFS's default here, and no other CI platform. Pin the image rather than
  # following macos-latest, and assert the machine architecture so a future
  # runner-label migration refuses instead of silently weakening the gate.
  #
  # The host step names `induced-failure` because the suite behind that feature
  # is filesystem behavior too: a revoked directory mode answering `EACCES`, and
  # a database left the way an aborted process leaves it. Without the feature
  # those files compile to zero tests, and the second filesystem this job exists
  # for would never see them.
  platform:
    name: determinism and filesystem (macOS ARM64)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Assert architecture
        run: test "$(uname -m)" = arm64
      - uses: Swatinem/rust-cache@v2
      - name: Embedding determinism
        run: .github/scripts/flake-tripwire.sh cargo test --locked -p norn-embed --test determinism
      - name: Filesystem contracts
        run: .github/scripts/flake-tripwire.sh cargo test --locked -p norn-fs
      - name: Host filesystem contracts
        run: .github/scripts/flake-tripwire.sh cargo test --locked -p norn-host --features induced-failure

  # The architecture gate: it reads `cargo metadata` once per entry in the
  # pinned feature matrix and asserts the workspace normal-dependency graph
  # against the allowlist in docs/architecture.md; it asserts the transcribed
  # allowlist and crate list against the tables in that document; it refuses a
  # local crate the workspace does not hold as a member; and it holds the
  # invariant-to-mechanism mapping to the boundary lints configured in
  # clippy.toml. The lints themselves bind in the build job, where clippy runs.
  architecture:
    name: architecture gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
      - name: Gate
        run: .github/scripts/flake-tripwire.sh cargo test --locked -p norn-testkit --test architecture

  # The counter half is a real gate, over the path a request really takes: a
  # generated vault tree on disk, a production attachment that walked it, and
  # the derived store that attachment left behind. Four bars run at profiles
  # the per-PR lane owns. A warm request over the ~2k-document realistic
  # profile finishes with every derivation counter at zero, over a detached
  # store and again under a live attachment. The store's read paths derive
  # nothing by construction today, so that bar is a canary rather than a number
  # the current code strains against: it binds the day a read path starts
  # deriving, and fails that as a correctness break rather than reporting it as
  # a slowdown. A find run through a live read hold reads nothing through
  # norn-fs on its own thread, lands nothing in the host's account of its jobs,
  # and runs a pinned number of statements a page. So does every other query
  # shape, each asked through its host verb at a pinned number of statements:
  # count-by-field, suffix / stem resolve, links-to, findings-for-path and
  # full-text match, and a get's page of a document's links and a describe.
  # And one bounded write, one bounded find, and each of those shapes in the
  # bounded form its verb's contract makes flat, cost the same at 300 documents
  # as at 2000 — the sharper bar, because a ceiling passes anything under it
  # and a pair fails the moment two scales stop moving together. A shape's cost
  # counts the steps of every statement run on its snapshot; those statement
  # counters do not see work a virtual table does inside a statement, so a
  # full-text match's posting-list walk is not among them. Each read pair runs
  # beside a control that grows with the vault and must read more at the
  # larger scale. And under the overlapping-reads-on-one-entry workload, eight
  # reads start while a ninth holds the entry's one connection, and the hold is
  # let go once the host's reader-wait reading names all eight as waiting:
  # each read runs exactly its snapshot's establishment under the entry gate,
  # the deferred BEGIN and the one statement that establishes the snapshot, as
  # the gate holder reads SQLite's own count of what it began on the holding
  # thread on both sides of its hold, and the gate's own take count reads no
  # retake inside that hold; the reader-wait reading is eight; and each contended
  # read took exactly one round of the entry gate after its first, none past
  # a ceiling authored in norn-host's baselines. Its control runs the same
  # reads one after another and must fail on contention alone. All four are
  # counts: a counter says the same thing on a loaded runner, which a clock
  # does not.
  #
  # The plan bars live in the store's own suites, beside the read builders that
  # emit the SQL they judge. An `EXPLAIN` assertion is worth something only
  # against the statement a builder emitted; a gate against hand-written SQL
  # tests a string nobody executes.
  #
  # The host's account of its jobs is read only behind `induced-failure`, so
  # this step names the feature. A build without it refuses the two cases that
  # read the account, and the lane table's own test holds this step to every feature
  # the suite puts a case or a helper behind.
  #
  # The cases live in this job alone, `#[ignore]`d with a `counter-lane case:`
  # reason so the build job's workspace suite does not attach thousands of
  # documents beside every other test. The script is what makes the wholesale
  # `--ignored` run fail when it ran nothing.
  gates:
    name: counter gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
      - name: Counter bars
        run: .github/scripts/flake-tripwire.sh .github/scripts/lane-suite.sh norn-host counter_gate --nocapture --test-threads=1
        env:
          LANE_FEATURES: induced-failure

  # A real gate. Each subject runs as a child under the testkit's process
  # harness, and what is read is the peak resident set the kernel accounted to
  # that child; a peak read off the test process would include cargo's runner
  # and every case beside it. Every subject faces a checked-in ceiling at the
  # ~2k-document realistic profile and a ratio, at profiles under 5k documents.
  # A subject whose cost could grow with the vault is paired across the
  # 300-document and ~2k-document profiles; a read is paired with the
  # attach-only peak at the same profile, which cancels the attach and leaves
  # the read. The ratio is the sharp instrument — a ceiling passes anything
  # that fits under it, and a ratio fails the moment its two readings stop
  # moving together. Every bar is authored and moves only by a reviewed edit;
  # the readings behind them are in each crate's own tests/baselines/mod.rs.
  #
  # The cases live in this job alone. They are `#[ignore]`d with a
  # `memory-lane case:` reason so the build job's workspace suite does not run
  # them: a measurement running beside every other test measures those tests
  # too, and "build and test" stays free of measurement. The step asks the
  # target for its ignored cases wholesale, which is why the >=5k cases are a
  # separate target (`memory_soak`) rather than a second reason in this one —
  # otherwise this lane would run certify.yml's wall-clock assertion. The script
  # is what makes that wholesale run fail when it ran nothing.
  #
  # Four subjects run here: the fixture generator, the norn-fs streaming walk,
  # a host attaching a generated vault — the first subject that measures a
  # whole vault's worth of work, where the generator and the walk each measure
  # one pass over a tree — and a host running the read mix over the vault it
  # attached. The read mix is one child that runs eight shapes through the
  # host's read verbs, each under its own live hold: a find under a predicate,
  # sorted and paged, a count by field, a get with suffix resolve, links-to,
  # backlinks, a validate narrowed by a path part, lexical search and
  # describe. The kernel reports one peak per child, so the read's resident-set
  # bars hold the highest peak any shape reached, over the attach beneath
  # them. The read's heap bar is the child's own count: the test binary's
  # global allocator counts the live heap, the child marks it once the attach
  # is ready, and a child at each per-PR profile reports the most the shapes
  # raised it, so the pair sees rows a whole-process peak absorbs. A child
  # that attaches adopts a tree its parent generated, so what the kernel
  # accounts to it is the attachment and not the generation.
  # The >=5k scale and the recorded peak-memory readings stay in certify.yml,
  # where a clock is legal to read.
  memory:
    name: memory invariant
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
      - name: Memory bars
        run: .github/scripts/flake-tripwire.sh .github/scripts/lane-suite.sh norn-fixtures memory --nocapture --test-threads=1
      - name: Walker memory bars
        run: .github/scripts/flake-tripwire.sh .github/scripts/lane-suite.sh norn-fs walk_memory --nocapture --test-threads=1
      - name: Host memory bars
        run: .github/scripts/flake-tripwire.sh .github/scripts/lane-suite.sh norn-host memory --nocapture --test-threads=1
