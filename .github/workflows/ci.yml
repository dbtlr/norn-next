# Per-PR gate lane.
#
# CI is two-tier: structure and counters gate here, clocks trend in soak.yml.
# No wall-clock pass/fail ever runs in this lane — see docs/architecture.md.
# "Counters" names the measurement gates this lane is being built toward; a
# gate that asserts structure rather than a number belongs here too, on the
# same terms.
#
# The timeout-minutes below are not an exception to that. A timeout is a
# runaway guard: it bounds what a hung job can cost, and it is set loose
# enough that a job approaching it is broken rather than slow. Performance
# clocks — the bars that fail when a number drifts — live in soak.yml.
#
# A job whose name carries a "(placeholder — ...)" suffix is structure only:
# it passes trivially so the lane exists, triggers, and is reviewable before
# it has teeth, and it is filled by whatever its comment names — a task where
# one exists, and otherwise the layer that brings the missing subject.
# The suffix drops when the real gate lands, so a green check on a job
# without one is a gate that actually ran.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR pushes are cancellable; gate runs on main are not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A real gate, not a placeholder: the workspace compiles clean, is
  # formatted, and its tests pass. The corpus suite is dormant — no command is
  # activated — so this job runs in seconds; what it asserts is that the
  # workspace holds together and that the corpus data is structurally sound.
  build:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # The toolchain comes from rust-toolchain.toml, which rustup honors.
      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Build
        run: cargo build --locked --workspace
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace

  # The architecture gate: it reads `cargo metadata` once per entry in the
  # pinned feature matrix and asserts the workspace normal-dependency graph
  # against the allowlist in docs/architecture.md; it asserts the transcribed
  # allowlist and crate list against the tables in that document; it refuses a
  # local crate the workspace does not hold as a member; and it holds the
  # invariant-to-mechanism mapping to the boundary lints configured in
  # clippy.toml. The lints themselves bind in the build job, where clippy runs.
  architecture:
    name: architecture gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Gate
        run: cargo test --locked -p norn-testkit --test architecture

  # Still a placeholder, and waiting on subjects rather than on machinery. The
  # machinery — counter snapshots, the SQL-and-plan pairing, the
  # size-independence pair — is in norn-testkit already.
  #
  # The derivation counters now exist: norn-store's requests carry their own
  # reading, its own suite asserts a read-only request finishes at zero, and
  # the readings feed norn-testkit's comparison primitives. What is still
  # missing is what makes a *gate* out of them — a request path over the
  # ~2k-document realistic profile, which arrives with the host. The EXPLAIN
  # bars wait on the Layer 3 read builders, because a plan assertion is only
  # worth anything against the statement a builder emitted. All of it is
  # counts, never clocks.
  gates:
    name: counter and plan gates (placeholder — Layers 1 and 3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Pending
        run: |
          echo "Counter and plan gates land with their subjects."
          echo "norn-store carries the counters; the bars need a request path"
          echo "over the ~2k-document profile, which the host brings."
          echo "Layer 3 (read builders): EXPLAIN plans against emitted SQL."

  # A real gate. It spawns the fixture generator under the testkit's process
  # harness and reads the peak resident set the kernel accounted to that child,
  # then asserts two things about it at profiles under 5k documents: a
  # checked-in ceiling at the ~2k-document realistic profile, and the ratio
  # between the 300-document and ~2k-document profiles. The ratio is the sharp
  # instrument — a ceiling passes anything that fits under it, and a ratio
  # fails the moment two scales stop moving together. Both bars are authored
  # and move only by a reviewed edit; the readings behind them are in
  # crates/norn-fixtures/tests/baselines/mod.rs.
  #
  # The cases live in this job alone. They are `#[ignore]`d with a
  # `memory-lane case:` reason so the build job's workspace suite does not run
  # them: a measurement running beside every other test measures those tests
  # too, and "build and test" stays free of measurement. The step asks the
  # target for its ignored cases wholesale, which is why the >=5k cases are a
  # separate target (`memory_soak`) rather than a second reason in this one —
  # otherwise this lane would run soak.yml's wall-clock assertion. The script
  # is what makes that wholesale run fail when it ran nothing.
  #
  # The generator is the subject because it is the one that exists. norn-store
  # slots in at Layer 1, and its request paths become what this job measures;
  # the >=5k scale and the recorded peak-memory readings stay in soak.yml,
  # where a clock is legal to read.
  memory:
    name: memory invariant
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Memory bars
        run: .github/scripts/lane-suite.sh norn-fixtures memory --nocapture --test-threads=1
      - name: Walker memory bars
        run: .github/scripts/lane-suite.sh norn-fs walk_memory --nocapture --test-threads=1
