# Per-PR gate lane.
#
# CI is two-tier: structure and counters gate here, clocks trend in soak.yml.
# No wall-clock pass/fail ever runs in this lane — see docs/architecture.md.
# "Counters" names the measurement gates this lane is being built toward; a
# gate that asserts structure rather than a number belongs here too, on the
# same terms.
#
# The timeout-minutes below are not an exception to that. A timeout is a
# runaway guard: it bounds what a hung job can cost, and it is set loose
# enough that a job approaching it is broken rather than slow. Performance
# clocks — the bars that fail when a number drifts — live in soak.yml.
#
# A job whose name carries a "(placeholder — ...)" suffix is structure only:
# it passes trivially so the lane exists, triggers, and is reviewable before
# it has teeth, and it is filled by the harness task named in its comment.
# The suffix drops when the real gate lands, so a green check on a job
# without one is a gate that actually ran.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR pushes are cancellable; gate runs on main are not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A real gate, not a placeholder: the workspace compiles clean, is
  # formatted, and its tests pass. The corpus suite is dormant — no command is
  # activated — so this job runs in seconds; what it asserts is that the
  # workspace holds together and that the corpus data is structurally sound.
  build:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The toolchain comes from rust-toolchain.toml, which rustup honors.
      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Build
        run: cargo build --workspace
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  # The architecture gate: it reads `cargo metadata` and asserts the workspace
  # normal-dependency graph against the allowlist in docs/architecture.md,
  # under the pinned feature matrix, and holds the invariant-to-mechanism
  # mapping to the boundary lints configured in clippy.toml. The lints
  # themselves bind in the build job, where clippy runs.
  architecture:
    name: architecture gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Gate
        run: cargo test -p norn-testkit --test architecture

  # Filled by NORN-13: size-independence pairs, and the counter and EXPLAIN
  # bars over the read builders that arrive with norn-store. The machinery
  # they are written with — counter snapshots, the SQL-and-plan pairing, the
  # scale pair — is in norn-testkit; what is missing is the subject. All
  # assertions are counts, never clocks, at a ~2k-document realistic fixture
  # profile.
  gates:
    name: counter and plan gates (placeholder — NORN-13)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Pending
        run: |
          echo "Counter and plan gates land with NORN-13."
          echo "Asserts: zero derivation counters on warm paths;"
          echo "         EXPLAIN plans against the builder's emitted SQL;"
          echo "         size-independence pairs, expressed as counts."

  # Filled by NORN-13 (instrumentation harness): peak memory at the
  # ~2k-document profile. The trend line over time lives in the soak lane;
  # this job is the per-PR bar.
  memory:
    name: memory invariant (placeholder — NORN-13)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Pending
        run: |
          echo "Memory invariant gate lands with NORN-13."
          echo "Asserts: peak memory is a function of the working set,"
          echo "         not of vault size."
