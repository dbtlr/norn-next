# Scheduled soak lane.
#
# The second tier of the two-tier CI posture: counters gate per PR (ci.yml),
# clocks trend here. Everything time-dependent or long-running lives in this
# lane — see docs/architecture.md.
#
# This lane runs the >=5k-document profile's work: the cases the per-PR suites
# carry as `#[ignore]`d, and the measurements whose readings are the lane's
# product. Each step runs a suite's ignored cases by kind rather than by name,
# because a name filter that stops matching runs zero tests and reports
# success.
#
# Every measurement is compared against a checked-in baseline in
# crates/norn-fixtures/tests/baselines/mod.rs and recorded in the job summary.
# The baselines are the trend's whole memory: peak memory is a ratchet, and the
# wall clock is a sanity ceiling set where a run past it is broken rather than
# slow. Nothing here fetches a history or consults a store.
name: soak

on:
  schedule:
    # Nightly, 04:00 UTC.
    #
    # GitHub disables schedules on repositories with no activity for 60 days,
    # so this lane running is a thing to check rather than assume. Lockdown
    # counts five consecutive green runs of it, and the count starts at the
    # first run under these assertions.
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # What the lane asserts today is the fixture generator at the >=5k profile:
  # that it reproduces its tree, that the tree stays inside the calibration
  # envelope, and what the generation costs in peak memory and wall clock.
  #
  # Two named slots remain, and both wait on the Layer 1 host rather than on
  # machinery: fd growth, which needs a long-running process to grow them, and
  # the nightly ~1h mixed load the flat-memory-slope requirement is judged
  # over. The timeout below fits the work that runs now with runaway headroom;
  # it is raised when the mixed load lands.
  soak:
    name: soak
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Determinism at the soak profile
        run: cargo test --locked -p norn-fixtures --test determinism -- --ignored
      - name: Calibration at the soak profile
        run: cargo test --locked -p norn-fixtures --test calibration -- --ignored
      - name: Memory and wall clock at the soak profile
        run: cargo test --locked -p norn-fixtures --test memory -- --ignored --nocapture
