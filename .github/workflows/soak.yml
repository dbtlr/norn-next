# Scheduled soak lane.
#
# The second tier of the two-tier CI posture: counters gate per PR (ci.yml),
# clocks trend here. Everything time-dependent or long-running lives in this
# lane — see docs/architecture.md and ADR 0001.
#
# Structure only. Filled by NORN-13 (instrumentation harness): wall-clock bars
# and the peak-memory trend line, plus the >=5k-document profiles and the
# nightly mixed load that the lockdown gate is judged against.
name: soak

on:
  schedule:
    # Nightly, 04:00 UTC.
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soak-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Filled by NORN-13. Lockdown requires five consecutive green runs of this
  # lane: zero counter violations, a flat memory slope, and no fd growth over a
  # nightly ~1h mixed load.
  soak:
    name: soak
    runs-on: ubuntu-latest
    steps:
      - name: Pending
        run: |
          echo "Soak lane lands with NORN-13."
          echo "Trends: wall-clock bars;"
          echo "        peak-memory trend line (only goes down);"
          echo "        fd growth over a nightly mixed load."
          echo "Profiles: >=5k documents; real pinned embedding model."
