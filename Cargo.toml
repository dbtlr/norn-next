[workspace]
resolver = "3"
members = ["crates/*"]
# `vendor/notify` is a patched copy of a published release, not a Norn crate.
# It carries no Norn code, holds no place in the crate map, and is excluded so
# that the architecture gate's crate scan and the workspace lints stay bound to
# the crates under `crates/`.
exclude = ["vendor/notify"]

# The macOS synchronization barrier needs an FSEvents event-history boundary
# that the published `notify` release does not expose. `vendor/README.md`
# states the release, the capability, and what removes the patch.
[patch.crates-io]
notify = { path = "vendor/notify" }

# The workspace holds only the crates that have been earned. A crate's
# absence here is not an absence from the crate map in docs/architecture.md,
# which describes the whole target shape; crates arrive with the work that
# earns them, and the dependency allowlist in that document is the complete
# set of permitted workspace edges.

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/dbtlr/norn"
publish = false

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive"] }
libc = "0.2"
# Platform notifications stay behind norn-fs; the crate erases backend event
# shapes into Norn's own typed invalidation batches.
notify = "8.2"
rustix = { version = "1.1", features = ["fs"] }
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
# `bundled` vendors SQLite itself, which is also what enables FTS5 and JSON1 —
# both of them store-schema requirements rather than optional extras.
# `fallible_uint` binds unsigned values to SQLite's signed integers with a
# checked conversion, so an offset or a length that does not fit is an error
# rather than a wrapped number.
# `hooks` carries the statement authorizer, which is what makes a read-only
# connection refuse to relax its own settings: a pragma, an attach and a
# temporary object are refused at statement preparation rather than left to a
# pragma any statement could undo.
# `functions` registers application-defined SQL functions: the path-glob match a
# read runs inside its statement, so a filter narrows the rows a page reads
# rather than a page being filtered after it was read. It adds no crate.
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint", "functions", "hooks"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
# The content hash the system concludes "unchanged" from. Declared here rather
# than per-crate so that the algorithm behind that conclusion is one version in
# one place: `norn-fs` computes it over vault bytes.
sha2 = "0.11"
# `float_roundtrip` parses a number back to the double that was written. A hit
# cursor carries a relevance score a continuation compares exactly, and the
# cursor is read back only where its re-encoding is the bytes it arrived as, so
# a score parsed one unit in the last place away is a cursor refused.
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_yaml = "0.9"
toml = "1"
