[workspace]
resolver = "3"
members = ["crates/*"]

# The workspace holds only the crates that have been earned. A crate's
# absence here is not an absence from the crate map in docs/architecture.md,
# which describes the whole target shape; crates arrive with the work that
# earns them, and the dependency allowlist in that document is the complete
# set of permitted workspace edges.

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/dbtlr/norn"
publish = false

[workspace.dependencies]
libc = "0.2"
# Platform notifications stay behind norn-fs; the crate erases backend event
# shapes into Norn's own typed invalidation batches.
notify = "8.2"
rustix = { version = "1.1", features = ["fs"] }
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
# `bundled` vendors SQLite itself, which is also what enables FTS5 and JSON1 —
# both of them store-schema requirements rather than optional extras.
# `fallible_uint` binds unsigned values to SQLite's signed integers with a
# checked conversion, so an offset or a length that does not fit is an error
# rather than a wrapped number.
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
# The content hash the system concludes "unchanged" from. Declared here rather
# than per-crate so that the algorithm behind that conclusion is one version in
# one place: `norn-fs` computes it over vault bytes.
sha2 = "0.11"
serde_json = "1"
serde_yaml = "0.9"
toml = "1"
