# The boundary-lint ruleset.
#
# Symbol-level rules the dependency graph cannot express live here, and they
# live here in one file because clippy's configuration does not merge
# per-crate: a workspace-root clippy.toml binds every crate, dev crates
# included. `cargo clippy --workspace --all-targets -- -D warnings` is where
# it bites.
#
# **A crate that legitimately owns an effect carves it out at the use site**,
# with `#[allow(clippy::disallowed_methods)]` or `#[allow(clippy::disallowed_types)]`
# on the smallest item that holds the effect. The allow is the audit marker:
# it says where the effect is, which a crate-wide allow would erase.
#
# Rules are adopted one at a time, as each invariant's subject becomes real.
# Which rules are configured and which are still named against the day their
# subject exists is recorded in the mapping in
# crates/norn-testkit/src/invariants.rs, which is the authoritative record of
# what carries which invariant. That mapping is asserted against this file: an
# entry here that no live rule claims fails the architecture gate, so a rule
# cannot arrive in one place and not the other. A claim no configured rule can
# express — `serde_json::Value` in a signature crossing the wire seam, which
# `disallowed-types` cannot separate from the same type in a test — is carried
# there as review-held rather than as a rule waiting on configuration.
#
# **Most of these rules bind std-surface effects, and for those that is their
# whole reach.** An effect reached another way is outside them and is
# review-held: a child process inheriting this process's stdout writes to a
# terminal no render seam saw, and a raw `libc` call reaches the filesystem
# without naming a `std` path. Neither is a lint's subject; both are a
# reviewer's. Two rules are the exception — the SQLite rule, whose subject is a
# registry crate's constructors, and the registry-surface rule, whose subject
# is a workspace crate's functions. Either is a path clippy resolves only in a
# crate that links it, which is why an entry naming one is silent everywhere
# else rather than an error.

# `std::fs` disallowed workspace-wide.
#
# The vault filesystem seam is norn-fs and the derived database's file
# lifecycle is norn-store's; every other filesystem effect is machine-local
# and belongs to the crate that owns that state. The entries cover the calls
# that reach a filesystem, including the ones spelled as `Path` methods —
# `path.exists()` is the same effect as `std::fs::metadata` and would
# otherwise be the way around the rule — the ones spelled through the unix
# extension traits, and `set_current_dir`, which relocates every relative path
# in the process at once.
disallowed-methods = [
    { path = "std::fs::canonicalize", reason = "a filesystem effect; norn-fs owns vault paths" },
    { path = "std::fs::copy", reason = "a filesystem effect; norn-fs owns vault bytes" },
    { path = "std::fs::create_dir", reason = "a filesystem effect; norn-fs owns vault paths" },
    { path = "std::fs::create_dir_all", reason = "a filesystem effect; norn-fs owns vault paths" },
    { path = "std::fs::exists", reason = "a filesystem effect; norn-fs owns vault paths" },
    { path = "std::fs::hard_link", reason = "a filesystem effect; norn-fs owns vault paths" },
    { path = "std::fs::metadata", reason = "a filesystem effect; norn-fs owns vault stat" },
    { path = "std::fs::read", reason = "a filesystem effect; norn-fs owns vault reads" },
    { path = "std::fs::read_dir", reason = "a filesystem effect; norn-fs owns the walk" },
    { path = "std::fs::read_link", reason = "a filesystem effect; norn-fs owns vault paths" },
    { path = "std::fs::read_to_string", reason = "a filesystem effect; norn-fs owns vault reads" },
    { path = "std::fs::remove_dir", reason = "a filesystem effect; norn-fs owns vault paths" },
    { path = "std::fs::remove_dir_all", reason = "a filesystem effect; norn-fs owns vault paths" },
    { path = "std::fs::remove_file", reason = "a filesystem effect; norn-fs owns vault paths" },
    { path = "std::fs::rename", reason = "the atomic-write protocol is norn-fs's, swap included" },
    { path = "std::fs::set_permissions", reason = "a filesystem effect; norn-fs owns vault paths" },
    { path = "std::fs::soft_link", reason = "a filesystem effect; norn-fs owns vault paths" },
    { path = "std::fs::symlink_metadata", reason = "a filesystem effect; norn-fs owns vault stat" },
    { path = "std::fs::write", reason = "the atomic-write protocol is norn-fs's; nothing writes a vault file directly" },
    { path = "std::fs::DirBuilder::new", reason = "a filesystem effect; norn-fs owns vault paths" },
    { path = "std::fs::File::create", reason = "a filesystem effect; norn-fs owns vault handles" },
    { path = "std::fs::File::create_new", reason = "a filesystem effect; norn-fs owns vault handles" },
    { path = "std::fs::File::open", reason = "a filesystem effect; norn-fs owns vault handles" },
    { path = "std::fs::File::options", reason = "a filesystem effect; norn-fs owns vault handles" },
    { path = "std::fs::OpenOptions::new", reason = "a filesystem effect; norn-fs owns vault handles" },
    { path = "std::path::Path::canonicalize", reason = "a filesystem effect spelled as a path method" },
    { path = "std::path::Path::exists", reason = "a filesystem effect spelled as a path method" },
    { path = "std::path::Path::is_dir", reason = "a filesystem effect spelled as a path method" },
    { path = "std::path::Path::is_file", reason = "a filesystem effect spelled as a path method" },
    { path = "std::path::Path::is_symlink", reason = "a filesystem effect spelled as a path method" },
    { path = "std::path::Path::metadata", reason = "a filesystem effect spelled as a path method" },
    { path = "std::path::Path::read_dir", reason = "a filesystem effect spelled as a path method" },
    { path = "std::path::Path::read_link", reason = "a filesystem effect spelled as a path method" },
    { path = "std::path::Path::symlink_metadata", reason = "a filesystem effect spelled as a path method" },
    { path = "std::path::Path::try_exists", reason = "a filesystem effect spelled as a path method" },
    # The same effects spelled through the unix extension traits, which reach
    # the filesystem without ever naming `std::fs`.
    { path = "std::os::unix::fs::chown", reason = "a filesystem effect; norn-fs owns vault paths" },
    { path = "std::os::unix::fs::fchown", reason = "a filesystem effect; norn-fs owns vault handles" },
    { path = "std::os::unix::fs::lchown", reason = "a filesystem effect; norn-fs owns vault paths" },
    { path = "std::os::unix::fs::symlink", reason = "a filesystem effect; norn-fs owns vault paths" },
    # The process's working directory is machine-local state shared by every
    # relative path in it, and a harness that changes it changes it for every
    # test running beside it.
    { path = "std::env::set_current_dir", reason = "process-wide state; a path is passed, never implied" },
    # No direct stdout writes outside norn-console. A handle to stdout is a
    # render seam nobody reviewed.
    { path = "std::io::stdout", reason = "norn-console owns the render seam; verbs return data" },
    # No SQLite connection opened outside norn-store. Opening is the act the
    # rule is about, so the constructors are its subject rather than the
    # `Connection` type: norn-store names that type throughout, and a crate-wide
    # allow on it would erase the marker this rule exists to leave. The
    # `from_handle` pair is in the set because adopting a raw `sqlite3*` produces
    # a live connection without naming a path — the same effect through a
    # constructor that does not read as an open.
    { path = "rusqlite::Connection::open", reason = "norn-store is the substrate seam; no other crate opens a connection" },
    { path = "rusqlite::Connection::open_in_memory", reason = "norn-store is the substrate seam; no other crate opens a connection" },
    { path = "rusqlite::Connection::open_with_flags", reason = "norn-store is the substrate seam; no other crate opens a connection" },
    { path = "rusqlite::Connection::open_with_flags_and_vfs", reason = "norn-store is the substrate seam; no other crate opens a connection" },
    { path = "rusqlite::Connection::open_in_memory_with_flags", reason = "norn-store is the substrate seam; no other crate opens a connection" },
    { path = "rusqlite::Connection::open_in_memory_with_flags_and_vfs", reason = "norn-store is the substrate seam; no other crate opens a connection" },
    { path = "rusqlite::Connection::from_handle", reason = "norn-store is the substrate seam; adopting a raw handle is opening one" },
    { path = "rusqlite::Connection::from_handle_owned", reason = "norn-store is the substrate seam; adopting a raw handle is opening one" },
    # No norn-config registry-surface use outside norn-host. The registry file
    # is the serving set, and reading or changing it is the orchestrator's act;
    # the machine surface beside it — endpoint discovery, token read — is
    # shared and has no entry here. `norn-config` re-exports nothing from
    # `registry` at its root, so every use of the surface names this path and
    # the rule can be stated over it.
    #
    # Reaching the file is the act the rule is about, so its subject is these
    # two functions rather than the module's types. The paths to the registry
    # file are not public, so a crate holding an `Entry` or a `Registry` and
    # neither of these functions has read nothing and written nothing. Naming
    # the types instead would fire on every declaration inside `norn-config`
    # itself, derive expansions included, and earn that crate a blanket allow —
    # which erases the use-site marker this rule exists to leave.
    { path = "norn_config::registry::read", reason = "the registry surface is norn-host's; the machine surface is what a client reads" },
    { path = "norn_config::registry::mutate", reason = "the registry surface is norn-host's; the machine surface is what a client reads" },
]

# The types that open a filesystem handle. A type only ever obtained from a
# call above — `Metadata`, `DirEntry`, `Permissions` — needs no entry: the
# call that produced it is already the rule's subject.
disallowed-types = [
    { path = "std::fs::DirBuilder", reason = "a filesystem effect; norn-fs owns vault paths" },
    { path = "std::fs::File", reason = "a filesystem effect; norn-fs owns vault handles" },
    { path = "std::fs::OpenOptions", reason = "a filesystem effect; norn-fs owns vault handles" },
]

# No direct stdout writes outside norn-console. Everything a person reads as
# output goes through the render seam; the carve-outs are machine-consumed
# byte streams and the dev crates' own command lines. Standard error is not
# this rule's subject.
disallowed-macros = [
    { path = "std::print", reason = "norn-console owns the render seam; verbs return data" },
    { path = "std::println", reason = "norn-console owns the render seam; verbs return data" },
]
